services:
  postgres:
    image: postgres:16-alpine
    container_name: conecta-patas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta
      POSTGRES_DB: conecta_patas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conecta_patas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
